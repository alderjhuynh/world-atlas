<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="hero">
  <div class="hero-inner">
    <h1 id="hero-title">Compendium Atlas</h1>
    <p class="hero-tagline" id="hero-tagline">A field atlas of lands, tongues, peoples, and powers.</p>
  </div>
</section>

<p class="intro-block" id="intro-block"></p>

<main class="wrap">
  <div class="section-heading"><h2>Categories</h2></div>
  <div class="atlas-grid" id="atlas-grid"></div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/data/index.js"></script>
<!-- ENTRY-SCRIPTS:BEGIN -->
<script src="js/data/bestiary/medicinal-flora.js"></script>
<script src="js/data/bestiary/vosarai-dyeflowers.js"></script>
<script src="js/data/continents/kharsa.js"></script>
<script src="js/data/continents/kyre.js"></script>
<script src="js/data/continents/seabreeze.js"></script>
<script src="js/data/continents/shattered-reach.js"></script>
<script src="js/data/continents/the-northern-wastes.js"></script>
<script src="js/data/continents/the-witchlands.js"></script>
<script src="js/data/continents/vaelmourn.js"></script>
<script src="js/data/history/calendars.js"></script>
<script src="js/data/languages/aurathil.js"></script>
<script src="js/data/languages/common.js"></script>
<script src="js/data/languages/vosarin.js"></script>
<script src="js/data/languages/xazryn.js"></script>
<script src="js/data/magic-systems/kyrite.js"></script>
<script src="js/data/magic-systems/marrowcraft.js"></script>
<script src="js/data/magic-systems/waygates.js"></script>
<script src="js/data/magic-systems/windwork.js"></script>
<script src="js/data/peoples/driftfolk.js"></script>
<script src="js/data/peoples/serevain.js"></script>
<script src="js/data/peoples/vosarai.js"></script>
<!-- ENTRY-SCRIPTS:END -->
<script src="js/render.js"></script>
<script>
  document.title = window.WORLD_CONFIG.siteName;
  document.getElementById("hero-title").textContent = window.WORLD_CONFIG.siteName;
  document.getElementById("hero-tagline").textContent = window.WORLD_CONFIG.tagline;
  const introEl = document.getElementById("intro-block");
  if (window.WORLD_CONFIG.intro) {
    introEl.textContent = window.WORLD_CONFIG.intro;
  } else {
    introEl.style.display = "none";
  }
  mountHeader(null);
  document.getElementById("atlas-grid").innerHTML = renderCollectionsGrid();
  mountFooter();
</script>
</body>
</html>
